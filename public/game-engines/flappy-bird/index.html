<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flappy Bird</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif;color:#fff;overflow:hidden;user-select:none}
.hud{display:flex;gap:20px;margin-bottom:12px;align-items:center}
.score-box{background:#16213e;border:1px solid #0f3460;border-radius:10px;padding:8px 20px;text-align:center}
.score-label{font-size:.62rem;color:#8892a4;letter-spacing:.06em}
.score-val{font-size:1.4rem;font-weight:900;color:#f5a623}
canvas{border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6);cursor:pointer}
.msg{margin-top:12px;font-size:.82rem;color:#8892a4}
</style>
</head>
<body>
<div class="hud">
  <div class="score-box"><div class="score-label">ĐIỂM</div><div class="score-val" id="sc">0</div></div>
  <div class="score-box"><div class="score-label">CAO NHẤT</div><div class="score-val" id="bs">0</div></div>
</div>
<canvas id="c" width="360" height="500"></canvas>
<div class="msg">Space / Click / Tap để bay</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=c.width,H=c.height;
const GAP=160,PIPE_W=60,BIRD_R=16,GRAV=0.42,FLAP=-8.5,SPEED=2.8;
let bird,pipes,score,best=+localStorage.getItem('fbBest')||0,state,frame;

function init(){
  bird={x:90,y:H/2,vy:0,rot:0};
  pipes=[];score=0;state='idle';frame=0;
  document.getElementById('bs').textContent=best;
  draw();
}

function flap(){
  if(state==='dead'){init();return;}
  if(state==='idle')state='play';
  bird.vy=FLAP;
}

function addPipe(){
  const top=80+Math.random()*(H-GAP-160);
  pipes.push({x:W,top,scored:false});
}

function tick(){
  if(state!=='play')return;
  frame++;
  if(frame%80===0)addPipe();
  bird.vy+=GRAV;
  bird.y+=bird.vy;
  bird.rot=Math.min(Math.max(bird.vy*4,-30),90);

  // Score
  pipes.forEach(p=>{
    p.x-=SPEED;
    if(!p.scored&&p.x+PIPE_W<bird.x){p.scored=true;score++;document.getElementById('sc').textContent=score;}
  });
  pipes=pipes.filter(p=>p.x+PIPE_W>0);

  // Collision
  if(bird.y-BIRD_R<0||bird.y+BIRD_R>H){die();return;}
  for(const p of pipes){
    if(bird.x+BIRD_R>p.x&&bird.x-BIRD_R<p.x+PIPE_W){
      if(bird.y-BIRD_R<p.top||bird.y+BIRD_R>p.top+GAP){die();return;}
    }
  }
}

function die(){
  state='dead';
  if(score>best){best=score;localStorage.setItem('fbBest',best);document.getElementById('bs').textContent=best;}
}

function draw(){
  // Sky gradient
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1a1a3e');sky.addColorStop(1,'#0d1b2a');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  // Stars
  ctx.fillStyle='rgba(255,255,255,0.4)';
  for(let i=0;i<30;i++){ctx.fillRect((i*137+frame)%W,(i*97)%200,1,1);}

  // Ground
  const ground=ctx.createLinearGradient(0,H-50,0,H);
  ground.addColorStop(0,'#2d5a27');ground.addColorStop(1,'#1a3a17');
  ctx.fillStyle=ground;ctx.fillRect(0,H-50,W,50);
  ctx.fillStyle='#3d7a35';ctx.fillRect(0,H-50,W,6);

  // Pipes
  pipes.forEach(p=>{
    const grad=ctx.createLinearGradient(p.x,0,p.x+PIPE_W,0);
    grad.addColorStop(0,'#2d8a2a');grad.addColorStop(0.5,'#4ab846');grad.addColorStop(1,'#1d6a1a');
    ctx.fillStyle=grad;
    // Top pipe
    ctx.fillRect(p.x,0,PIPE_W,p.top);
    ctx.fillStyle='#4ab846';ctx.fillRect(p.x-6,p.top-24,PIPE_W+12,24);
    // Bottom pipe
    ctx.fillStyle=grad;
    ctx.fillRect(p.x,p.top+GAP,PIPE_W,H-p.top-GAP-50);
    ctx.fillStyle='#4ab846';ctx.fillRect(p.x-6,p.top+GAP,PIPE_W+12,24);
  });

  // Bird
  ctx.save();
  ctx.translate(bird.x,bird.y);
  ctx.rotate(bird.rot*Math.PI/180);
  // Body
  ctx.fillStyle='#f5a623';ctx.beginPath();ctx.ellipse(0,0,BIRD_R,BIRD_R-2,0,0,Math.PI*2);ctx.fill();
  // Wing flap
  const wingY=Math.sin(frame*.3)*4;
  ctx.fillStyle='#e8941e';ctx.beginPath();ctx.ellipse(-8,wingY+4,10,6,-.4,0,Math.PI*2);ctx.fill();
  // Eye
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(6,-4,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(7,-4,2.5,0,Math.PI*2);ctx.fill();
  // Beak
  ctx.fillStyle='#e8541e';ctx.beginPath();ctx.moveTo(14,-2);ctx.lineTo(20,0);ctx.lineTo(14,3);ctx.closePath();ctx.fill();
  ctx.restore();

  // Overlay messages
  if(state==='idle'){
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f5a623';ctx.font='bold 32px Segoe UI';ctx.textAlign='center';ctx.fillText('🐦 Flappy Bird',W/2,H/2-60);
    ctx.fillStyle='#fff';ctx.font='16px Segoe UI';ctx.fillText('Nhấn Space hoặc Click để bắt đầu',W/2,H/2-20);
  }
  if(state==='dead'){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e94560';ctx.font='bold 28px Segoe UI';ctx.textAlign='center';ctx.fillText('💀 Game Over!',W/2,H/2-50);
    ctx.fillStyle='#fff';ctx.font='20px Segoe UI';ctx.fillText(`Điểm: ${score}`,W/2,H/2-10);
    ctx.font='14px Segoe UI';ctx.fillStyle='#8892a4';ctx.fillText('Click hoặc Space để chơi lại',W/2,H/2+25);
  }
}

function loop(){tick();draw();requestAnimationFrame(loop);}
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap();}});
c.addEventListener('click',flap);
document.addEventListener('touchstart',e=>{e.preventDefault();flap();},{passive:false});
document.getElementById('bs').textContent=best;
init();loop();
</script>
</body>
</html>
