<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Classic</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0d1117;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; color: #c9d1d9;
    user-select: none;
  }
  .hud { display:flex; justify-content:space-between; align-items:center; width:100%; max-width:420px; margin-bottom:14px; }
  .game-title { font-size:1.8rem; font-weight:900; color:#7ee787; letter-spacing:-0.03em; }
  .score-row { display:flex; gap:10px; }
  .score-box { background:#161b22; border:1px solid #30363d; border-radius:10px; padding:8px 16px; text-align:center; }
  .score-label { font-size:0.62rem; font-weight:700; color:#6e7681; letter-spacing:0.06em; }
  .score-val { font-size:1.3rem; font-weight:800; color:#7ee787; }
  .controls-bar { display:flex; gap:10px; margin-bottom:14px; }
  .btn-game { background:linear-gradient(135deg,#238636,#56d364); border:none; border-radius:10px; color:#fff; font-size:0.85rem; font-weight:700; padding:8px 20px; cursor:pointer; transition:opacity .2s; }
  .btn-game:hover { opacity:.82; }
  canvas { border-radius:12px; display:block; box-shadow:0 20px 60px rgba(0,0,0,.7); }
  .hint { margin-top:14px; font-size:0.8rem; color:#6e7681; text-align:center; }
  .status { font-size:0.9rem; color:#7ee787; font-weight:600; margin-bottom:8px; min-height:1.2em; }
</style>
</head>
<body>
<div class="hud">
  <div class="game-title">🐍 Snake</div>
  <div class="score-row">
    <div class="score-box"><div class="score-label">ĐIỂM</div><div class="score-val" id="score">0</div></div>
    <div class="score-box"><div class="score-label">CAO NHẤT</div><div class="score-val" id="best">0</div></div>
  </div>
</div>
<div class="status" id="status">Nhấn Space để bắt đầu</div>
<div class="controls-bar">
  <button class="btn-game" onclick="startGame()">▶ Bắt Đầu</button>
  <button class="btn-game" onclick="togglePause()">⏸ Pause</button>
</div>
<canvas id="canvas" width="400" height="400"></canvas>
<div class="hint">WASD / ← → ↑ ↓ để điều khiển &nbsp;|&nbsp; Space: Pause</div>

<script>
const C = document.getElementById('canvas');
const ctx = C.getContext('2d');
const COLS = 20, ROWS = 20;
const CS = C.width / COLS; // cell size

let snake, dir, nextDir, food, score, best=0, loop, running=false, paused=false;

function startGame() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  score = 0; running = true; paused = false;
  placeFood();
  clearInterval(loop);
  loop = setInterval(tick, 120);
  setStatus('');
}

function placeFood() {
  do {
    food = {x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)};
  } while (snake.some(s => s.x===food.x && s.y===food.y));
}

function tick() {
  if (paused) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // Wall collision
  if (head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS) { gameOver(); return; }
  // Self collision
  if (snake.some(s=>s.x===head.x&&s.y===head.y)) { gameOver(); return; }

  snake.unshift(head);
  if (head.x===food.x&&head.y===food.y) {
    score += 10; placeFood();
    if (score > best) { best=score; localStorage.setItem('snakeBest',best); }
  } else {
    snake.pop();
  }
  draw();
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
}

function draw() {
  // Background
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0,0,C.width,C.height);

  // Grid dots
  ctx.fillStyle = '#161b22';
  for(let x=0;x<COLS;x++) for(let y=0;y<ROWS;y++) {
    ctx.fillRect(x*CS+CS/2-1, y*CS+CS/2-1, 2, 2);
  }

  // Food
  const grd = ctx.createRadialGradient(food.x*CS+CS/2, food.y*CS+CS/2, 2, food.x*CS+CS/2, food.y*CS+CS/2, CS/2-2);
  grd.addColorStop(0,'#ff7b72'); grd.addColorStop(1,'#e11d48');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(food.x*CS+CS/2, food.y*CS+CS/2, CS/2-3, 0, Math.PI*2);
  ctx.fill();

  // Snake
  snake.forEach((seg, i) => {
    const t = i/snake.length;
    ctx.fillStyle = i===0 ? '#56d364' : `hsl(${130-t*30}, 70%, ${55-t*15}%)`;
    const pad = i===0 ? 1 : 2;
    roundRect(ctx, seg.x*CS+pad, seg.y*CS+pad, CS-pad*2, CS-pad*2, i===0?6:4);
    ctx.fill();
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function gameOver() {
  clearInterval(loop); running = false;
  setStatus(`💀 Game Over! Điểm: ${score}. Nhấn Bắt Đầu để thử lại.`);
  // Flash
  ctx.fillStyle = 'rgba(225,29,72,0.25)';
  ctx.fillRect(0,0,C.width,C.height);
}

function togglePause() {
  if (!running) return;
  paused = !paused;
  setStatus(paused ? '⏸ Đã tạm dừng' : '');
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

document.addEventListener('keydown', e => {
  const map = {
    ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
    w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0},
    W:{x:0,y:-1}, S:{x:0,y:1}, A:{x:-1,y:0}, D:{x:1,y:0},
  };
  if (e.code==='Space') { e.preventDefault(); if(!running) startGame(); else togglePause(); return; }
  const d = map[e.key];
  if (d) {
    e.preventDefault();
    // Prevent reverse
    if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
  }
});

// Touch controls
let tx, ty;
C.addEventListener('touchstart', e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; },{passive:true});
C.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX-tx, dy = e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)) nextDir = dx>0?{x:1,y:0}:{x:-1,y:0};
  else nextDir = dy>0?{x:0,y:1}:{x:0,y:-1};
});

best = parseInt(localStorage.getItem('snakeBest')||'0');
document.getElementById('best').textContent = best;

// Initial draw
ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,C.width,C.height);
ctx.fillStyle='#30363d'; ctx.font='bold 16px Segoe UI'; ctx.textAlign='center';
ctx.fillText('Nhấn ▶ Bắt Đầu để chơi', C.width/2, C.height/2);
</script>
</body>
</html>
