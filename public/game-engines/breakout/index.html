<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brick Breaker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f1a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif;color:#fff;user-select:none}
.hud{display:flex;gap:14px;margin-bottom:10px}
.stat{background:#16213e;border:1px solid #0f3460;border-radius:8px;padding:7px 16px;text-align:center}
.stat-l{font-size:.6rem;color:#8892a4;letter-spacing:.06em}
.stat-v{font-size:1.2rem;font-weight:900;color:#f5a623}
canvas{border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.7);cursor:none}
.hint{margin-top:10px;font-size:.78rem;color:#6c7086}
</style>
</head>
<body>
<div class="hud">
  <div class="stat"><div class="stat-l">ĐIỂM</div><div class="stat-v" id="sc">0</div></div>
  <div class="stat"><div class="stat-l">MẠNG</div><div class="stat-v" id="lv">3</div></div>
  <div class="stat"><div class="stat-l">MÀN</div><div class="stat-v" id="lv2">1</div></div>
  <div class="stat"><div class="stat-l">CAO NHẤT</div><div class="stat-v" id="bs">0</div></div>
</div>
<canvas id="c" width="420" height="480"></canvas>
<div class="hint">Di chuyển Chuột để điều khiển mái chèo</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=c.width,H=c.height;
const COLS=9,ROWS=6,BRICK_W=40,BRICK_H=18,BRICK_GAP=4;
const PADW=80,PADH=10,BALL_R=7;
let ball,paddle,bricks,score,best=+localStorage.getItem('boBest')||0,lives,level,state='idle';

const BRICK_COLORS=[['#f38ba8','#e11d48'],['#fab387','#ea580c'],['#f9e2af','#ca8a04'],['#a6e3a1','#16a34a'],['#89b4fa','#2563eb'],['#cba6f7','#7c3aed']];

function init(){
  paddle={x:W/2-PADW/2,y:H-30,w:PADW};
  ball={x:W/2,y:H-60,vx:3*(Math.random()>.5?1:-1),vy:-4,active:false};
  bricks=[];score=0;lives=3;level=1;state='play';
  makeBricks();updateHUD();
}

function makeBricks(){
  bricks=[];
  const ox=(W-COLS*(BRICK_W+BRICK_GAP)+BRICK_GAP)/2;
  for(let r=0;r<Math.min(ROWS,r+3+level);r++)for(let c=0;c<COLS;c++){
    const hp=r<2?3:r<4?2:1;
    bricks.push({x:ox+c*(BRICK_W+BRICK_GAP),y:40+r*(BRICK_H+BRICK_GAP),w:BRICK_W,h:BRICK_H,hp,maxHp:hp,col:BRICK_COLORS[r%BRICK_COLORS.length]});
  }
}

function tick(){
  if(state!=='play')return;
  if(!ball.active){ball.x=paddle.x+paddle.w/2;ball.y=H-60;return;}

  ball.x+=ball.vx;ball.y+=ball.vy;

  // Wall bounce
  if(ball.x-BALL_R<0){ball.x=BALL_R;ball.vx*=-1;}
  if(ball.x+BALL_R>W){ball.x=W-BALL_R;ball.vx*=-1;}
  if(ball.y-BALL_R<0){ball.y=BALL_R;ball.vy*=-1;}

  // Paddle bounce
  if(ball.vy>0&&ball.y+BALL_R>=paddle.y&&ball.y+BALL_R<=paddle.y+PADH&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w){
    ball.vy*=-1;
    const rel=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
    ball.vx=rel*5;
    const spd=Math.hypot(ball.vx,ball.vy);if(spd>8){ball.vx=ball.vx/spd*8;ball.vy=ball.vy/spd*8;}
  }

  // Bottom — lose life
  if(ball.y-BALL_R>H){
    lives--;updateHUD();
    if(lives<=0){state='dead';return;}
    ball.active=false;
  }

  // Brick collision
  bricks.forEach(b=>{
    if(b.hp<=0)return;
    if(ball.x+BALL_R>b.x&&ball.x-BALL_R<b.x+b.w&&ball.y+BALL_R>b.y&&ball.y-BALL_R<b.y+b.h){
      b.hp--;score+=10*b.maxHp;if(score>best){best=score;localStorage.setItem('boBest',best);}
      // Which side?
      const dx=Math.min(ball.x+BALL_R-b.x,b.x+b.w-(ball.x-BALL_R));
      const dy=Math.min(ball.y+BALL_R-b.y,b.y+b.h-(ball.y-BALL_R));
      if(dx<dy)ball.vx*=-1;else ball.vy*=-1;
      updateHUD();
    }
  });
  bricks=bricks.filter(b=>b.hp>0);
  if(bricks.length===0){level++;makeBricks();ball.active=false;updateHUD();}
}

function updateHUD(){
  document.getElementById('sc').textContent=score;
  document.getElementById('lv').textContent='❤️'.repeat(lives)||'0';
  document.getElementById('lv2').textContent=level;
  document.getElementById('bs').textContent=best;
}

function draw(){
  // BG
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0f0f1a');g.addColorStop(1,'#16213e');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // Bricks
  bricks.forEach(b=>{
    if(b.hp<=0)return;
    const alpha=b.hp/b.maxHp;
    ctx.fillStyle=b.col[0];ctx.globalAlpha=.3+alpha*.7;
    ctx.beginPath();roundRect(ctx,b.x,b.y,b.w,b.h,4);ctx.fill();
    ctx.globalAlpha=1;
    ctx.strokeStyle=b.col[1];ctx.lineWidth=1.5;
    ctx.beginPath();roundRect(ctx,b.x,b.y,b.w,b.h,4);ctx.stroke();
    // HP dots
    for(let i=0;i<b.hp;i++){ctx.fillStyle=b.col[1];ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(b.x+6+i*6,b.y+b.h/2,2,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;
  });

  // Paddle
  const pg=ctx.createLinearGradient(paddle.x,0,paddle.x+paddle.w,0);
  pg.addColorStop(0,'#89b4fa');pg.addColorStop(1,'#cba6f7');
  ctx.fillStyle=pg;ctx.beginPath();roundRect(ctx,paddle.x,paddle.y,paddle.w,PADH,5);ctx.fill();

  // Ball
  if(ball.active){
    const bg=ctx.createRadialGradient(ball.x-2,ball.y-2,1,ball.x,ball.y,BALL_R);
    bg.addColorStop(0,'#fff');bg.addColorStop(1,'#f9e2af');
    ctx.fillStyle=bg;ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_R,0,Math.PI*2);ctx.fill();
  } else {
    ctx.fillStyle='rgba(249,226,175,.4)';ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_R,0,Math.PI*2);ctx.fill();
  }

  // Messages
  ctx.textAlign='center';
  if(state==='idle'){
    ctx.fillStyle='rgba(15,15,26,.8)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f5a623';ctx.font='bold 30px Segoe UI';ctx.fillText('🏓 Brick Breaker',W/2,H/2-60);
    ctx.fillStyle='#cdd6f4';ctx.font='15px Segoe UI';ctx.fillText('Click để bắt đầu',W/2,H/2-20);
  }
  if(!ball.active&&state==='play'){
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='13px Segoe UI';ctx.fillText('Click để bắn bóng',W/2,H-60);
  }
  if(state==='dead'){
    ctx.fillStyle='rgba(15,15,26,.85)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f38ba8';ctx.font='bold 28px Segoe UI';ctx.fillText('💀 Game Over!',W/2,H/2-50);
    ctx.fillStyle='#cdd6f4';ctx.font='18px Segoe UI';ctx.fillText(`Điểm: ${score}`,W/2,H/2-10);
    ctx.font='13px Segoe UI';ctx.fillStyle='#8892a4';ctx.fillText('Click để chơi lại',W/2,H/2+25);
  }
  if(state==='win'){
    ctx.fillStyle='rgba(6,78,59,.85)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#a6e3a1';ctx.font='bold 28px Segoe UI';ctx.fillText('🎉 Thắng Rồi!',W/2,H/2-40);
    ctx.font='13px Segoe UI';ctx.fillStyle='#fff';ctx.fillText('Click để chơi lại',W/2,H/2+10);
  }
}

function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();paddle.x=Math.max(0,Math.min(W-paddle.w,e.clientX-r.left-paddle.w/2));if(!ball.active&&state==='play')ball.x=paddle.x+paddle.w/2;});
c.addEventListener('touchmove',e=>{e.preventDefault();const r=c.getBoundingClientRect();paddle.x=Math.max(0,Math.min(W-paddle.w,e.touches[0].clientX-r.left-paddle.w/2));if(!ball.active&&state==='play')ball.x=paddle.x+paddle.w/2;},{passive:false});
c.addEventListener('click',()=>{
  if(state==='idle'){init();return;}
  if(state==='dead'||state==='win'){init();return;}
  if(!ball.active){ball.active=true;ball.vy=-5+(-level*.2);}
});

function loop(){tick();draw();requestAnimationFrame(loop);}
document.getElementById('bs').textContent=best;
draw();loop();
</script>
</body>
</html>
