<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pong vs CPU</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Courier New',monospace;color:#fff;user-select:none}
.hud{display:flex;gap:40px;margin-bottom:10px;font-size:2rem;font-weight:900;letter-spacing:.1em}
.score-you{color:#a6e3a1}.score-cpu{color:#f38ba8}
canvas{box-shadow:0 0 60px rgba(100,200,100,.15)}
.hint{margin-top:10px;font-size:.78rem;color:#555}
</style>
</head>
<body>
<div class="hud">
  <span class="score-you" id="sc-you">0</span>
  <span style="color:#333">:</span>
  <span class="score-cpu" id="sc-cpu">0</span>
</div>
<canvas id="c" width="520" height="360"></canvas>
<div class="hint">Chuột / W•S để điều khiển &nbsp;|&nbsp; Enter: bắt đầu &nbsp;|&nbsp; Đến 7 điểm thắng</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=c.width,H=c.height;
const PAD_W=10,PAD_H=70,BALL_R=7,WIN_SCORE=7;
let you,cpu,ball,scoreYou,scoreCpu,state='idle',frame=0;
const keys={};

function init(){
  you={x:20,y:H/2-PAD_H/2,h:PAD_H,vy:0};
  cpu={x:W-20-PAD_W,y:H/2-PAD_H/2,h:PAD_H,vy:0};
  ball={x:W/2,y:H/2,vx:4*(Math.random()>.5?1:-1),vy:(Math.random()-.5)*4};
  scoreYou=0;scoreCpu=0;state='play';frame=0;updateHUD();
}

function reset(scorer){
  ball={x:W/2,y:H/2,vx:4*(scorer==='cpu'?-1:1),vy:(Math.random()-.5)*4};
  you.y=H/2-PAD_H/2;cpu.y=H/2-PAD_H/2;
}

function tick(){
  if(state!=='play')return;
  frame++;

  // You paddle
  if(keys['w']||keys['W'])you.y=Math.max(0,you.y-7);
  if(keys['s']||keys['S'])you.y=Math.min(H-you.h,you.y+7);

  // CPU AI
  const cpuCenter=cpu.y+cpu.h/2;
  const diff=ball.y-cpuCenter;
  const aiSpd=3.5+Math.min(Math.abs(diff)*.03,2);
  cpu.y+=Math.sign(diff)*Math.min(Math.abs(diff),aiSpd);
  cpu.y=Math.max(0,Math.min(H-cpu.h,cpu.y));

  // Mouse
  // Ball
  ball.x+=ball.vx;ball.y+=ball.vy;
  // Wall
  if(ball.y-BALL_R<0){ball.y=BALL_R;ball.vy*=-1;}
  if(ball.y+BALL_R>H){ball.y=H-BALL_R;ball.vy*=-1;}

  // Paddle collisions
  function padHit(pad){
    if(ball.x-BALL_R<pad.x+PAD_W&&ball.x+BALL_R>pad.x&&ball.y>pad.y&&ball.y<pad.y+pad.h){
      const rel=(ball.y-(pad.y+pad.h/2))/(pad.h/2);
      ball.vy=rel*6;
      const spd=Math.min(Math.hypot(ball.vx,ball.vy)*1.05,12);
      ball.vx=-Math.sign(ball.vx)*spd*Math.cos(Math.atan2(ball.vy,ball.vx)>0?1:-1);
      ball.vx=Math.sign(ball.vx)*Math.sqrt(spd*spd-ball.vy*ball.vy);
      return true;
    }
    return false;
  }
  padHit(you);padHit(cpu);

  // Score
  if(ball.x-BALL_R<0){scoreCpu++;updateHUD();if(scoreCpu>=WIN_SCORE){state='win-cpu';return;}reset('cpu');}
  if(ball.x+BALL_R>W){scoreYou++;updateHUD();if(scoreYou>=WIN_SCORE){state='win-you';return;}reset('you');}
}

function updateHUD(){
  document.getElementById('sc-you').textContent=scoreYou;
  document.getElementById('sc-cpu').textContent=scoreCpu;
}

function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  // Net
  ctx.setLineDash([8,8]);ctx.strokeStyle='#333';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();
  ctx.setLineDash([]);

  // Paddles
  const youGrad=ctx.createLinearGradient(you.x,you.y,you.x,you.y+you.h);
  youGrad.addColorStop(0,'#56d364');youGrad.addColorStop(1,'#1a7f37');
  ctx.fillStyle=youGrad;ctx.fillRect(you.x,you.y,PAD_W,you.h);

  const cpuGrad=ctx.createLinearGradient(cpu.x,cpu.y,cpu.x,cpu.y+cpu.h);
  cpuGrad.addColorStop(0,'#f85149');cpuGrad.addColorStop(1,'#8b0000');
  ctx.fillStyle=cpuGrad;ctx.fillRect(cpu.x,cpu.y,PAD_W,cpu.h);

  // Ball
  if(state==='play'){
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_R,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_R+4,0,Math.PI*2);ctx.fill();
  }

  // Labels
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.font='11px Courier New';ctx.textAlign='center';
  ctx.fillText('BẠN',W/4,18);ctx.fillText('CPU',3*W/4,18);

  // Overlays
  if(state==='idle'){
    ctx.fillStyle='rgba(0,0,0,.85)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#a6e3a1';ctx.font='bold 28px Courier New';ctx.fillText('🏓 PONG',W/2,H/2-50);
    ctx.fillStyle='#cdd6f4';ctx.font='15px Courier New';ctx.fillText('Nhấn Enter để bắt đầu',W/2,H/2-10);
    ctx.font='12px Courier New';ctx.fillStyle='#555';ctx.fillText('W/S hoặc di chuột để điều khiển',W/2,H/2+20);
  }
  if(state==='win-you'){
    ctx.fillStyle='rgba(0,78,50,.85)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#a6e3a1';ctx.font='bold 28px Courier New';ctx.fillText('🏆 CHIẾN THẮNG!',W/2,H/2-30);
    ctx.font='14px Courier New';ctx.fillStyle='#cdd6f4';ctx.fillText('Enter để chơi lại',W/2,H/2+14);
  }
  if(state==='win-cpu'){
    ctx.fillStyle='rgba(78,0,0,.85)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f38ba8';ctx.font='bold 28px Courier New';ctx.fillText('💀 CPU THẮNG!',W/2,H/2-30);
    ctx.font='14px Courier New';ctx.fillStyle='#cdd6f4';ctx.fillText('Enter để thử lại',W/2,H/2+14);
  }
}

c.addEventListener('mousemove',e=>{
  const r=c.getBoundingClientRect();
  you.y=Math.max(0,Math.min(H-you.h,e.clientY-r.top-you.h/2));
});
document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='Enter'){if(state!=='play')init();}});
document.addEventListener('keyup',e=>{keys[e.key]=false;});
c.addEventListener('touchmove',e=>{e.preventDefault();const r=c.getBoundingClientRect();you.y=Math.max(0,Math.min(H-you.h,e.touches[0].clientY-r.top-you.h/2));},{passive:false});

function loop(){tick();draw();requestAnimationFrame(loop);}
draw();loop();
</script>
</body>
</html>
