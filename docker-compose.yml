services:
    # ── 1. PHP 8.3 Application Service ──────────────────────────────────────────
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: techhub-app:latest
        container_name: techhub_app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        environment:
            - DB_HOST=mysql
            - DB_PORT=3306
            - DB_DATABASE=${DB_DATABASE:-techhub}
            - DB_USERNAME=${DB_USERNAME:-techhub_user}
            - DB_PASSWORD=${DB_PASSWORD:-techhub_secret}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
        networks:
            - techhub_network
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    # ── 2. Nginx High-Performance Web Server ───────────────────────────────────
    web:
        image: nginx:1.25-alpine
        container_name: techhub_web
        restart: unless-stopped
        ports:
            - "${APP_PORT:-8088}:80"
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        networks:
            - techhub_network
        depends_on:
            - app

    # ── 3. MySQL 8.0 Database ──────────────────────────────────────────────────
    mysql:
        image: mysql:8.0
        container_name: techhub_mysql
        restart: unless-stopped
        ports:
            - "${DB_PORT:-33066}:3306"
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-techhub}
            MYSQL_USER: ${DB_USERNAME:-techhub_user}
            MYSQL_PASSWORD: ${DB_PASSWORD:-techhub_secret}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
        volumes:
            - techhub_mysql_data:/var/lib/mysql
        networks:
            - techhub_network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
            interval: 5s
            timeout: 5s
            retries: 10

    # ── 4. Redis Cache & Queue ─────────────────────────────────────────────────
    redis:
        image: redis:7-alpine
        container_name: techhub_redis
        restart: unless-stopped
        ports:
            - "${REDIS_PORT:-63799}:6379"
        volumes:
            - techhub_redis_data:/data
        networks:
            - techhub_network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

    # ── 5. phpMyAdmin (Optional Database UI) ────────────────────────────────────
    phpmyadmin:
        image: phpmyadmin:5.2-apache
        container_name: techhub_phpmyadmin
        restart: unless-stopped
        ports:
            - "${PMA_PORT:-8081}:80"
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
        networks:
            - techhub_network
        depends_on:
            - mysql

networks:
    techhub_network:
        driver: bridge

volumes:
    techhub_mysql_data:
        driver: local
    techhub_redis_data:
        driver: local
