name: TechHub CI / CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. CI: Automated Code Quality & Testing Suite
  # ─────────────────────────────────────────────────────────────
  ci-testing:
    name: 🧪 Run Tests & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.3 Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite3, pdo_sqlite, bcmath, curl, gd, zip
          coverage: none

      - name: 🔑 Setup Environment File
        run: cp .env.example .env

      - name: ⚙️ Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: 🔑 Generate Application Key
        run: php artisan key:generate

      - name: 🔒 Set Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: 🗄️ Prepare Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: 🚀 Execute Automated Tests (PHPUnit / Pest)
        run: php artisan test

  # ─────────────────────────────────────────────────────────────
  # 2. CD: Automated Deployment to VPS (Runs only on main push)
  # ─────────────────────────────────────────────────────────────
  cd-deployment:
    name: 🚀 Deploy to Production VPS
    needs: [ci-testing]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 📡 SSH & Deploy TechHub on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 [TechHub CD] Bắt đầu tự động cập nhật phiên bản mới..."
            cd ~/techhub || cd /root/techhub
            
            # Ghi nhớ commit đang hoạt động ổn định trước khi pull
            PREV_COMMIT=$(git rev-parse HEAD)
            echo "📌 Commit ổn định hiện tại: $PREV_COMMIT"
            
            # Hàm Rollback tự động khi có bất kỳ lỗi nào xảy ra
            rollback() {
              echo "❌ [DEPLOY ERROR] Phát hiện lỗi trong quá trình triển khai trên VPS!"
              echo "⏪ Đang tự động Rollback về commit an toàn trước đó: $PREV_COMMIT..."
              git reset --hard $PREV_COMMIT
              docker compose exec -T app php artisan optimize:clear
              docker compose exec -T app php artisan optimize
              echo "⚠️ Đã khôi phục website về phiên bản cũ an toàn thành công."
              exit 1
            }
            trap rollback ERR
            
            echo "📥 1. Kéo mã nguồn mới nhất từ GitHub..."
            git pull origin main
            
            echo "📦 Cập nhật các gói thư viện (Composer)..."
            docker compose exec -T app composer install --no-dev --optimize-autoloader --no-interaction
            
            echo "⚡ 2. Tối ưu bộ nhớ đệm Production..."
            docker compose exec -T app php artisan optimize:clear
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
            docker compose exec -T app php artisan event:cache
            docker compose exec -T app php artisan optimize
            
            echo "🗄️ 3. Chạy cập nhật cấu trúc Database..."
            docker compose exec -T app php artisan migrate --force
            
            echo "🔒 4. Đảm bảo phân quyền storage..."
            docker compose exec -T app chmod -R 775 storage bootstrap/cache
            
            # Hủy trap khi tất cả các bước đã hoàn tất thành công
            trap - ERR
            echo "✅ [TechHub CD] Triển khai thành công 100%! Website đã cập nhật tức thì và an toàn tuyệt đối."
